name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'monitoring/**'

jobs:
  ci:
    name: CI - Lint, Type Check, Security, Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.eval.txt
          pip install ruff mypy bandit pytest pytest-cov

      - name: Optional DVC pull for test data
        env:
          DVC_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          DVC_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DVC_AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          if [ ! -f dvc.yaml ]; then
            echo "dvc.yaml não encontrado; seguindo sem dvc pull."
            exit 0
          fi

          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "Credenciais DVC ausentes. Seguindo com fixtures locais versionadas."
            exit 0
          fi

          AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-${DVC_AWS_DEFAULT_REGION:-us-east-1}}"
          DVC_AWS_DEFAULT_REGION="${DVC_AWS_DEFAULT_REGION:-$AWS_DEFAULT_REGION}"
          export AWS_DEFAULT_REGION DVC_AWS_DEFAULT_REGION
          echo "Usando região AWS para DVC: ${DVC_AWS_DEFAULT_REGION}"

          echo "Credenciais DVC detectadas. Executando dvc pull antes dos testes..."
          pip install dvc[s3]
          if ! dvc pull --force; then
            echo "dvc pull falhou; seguindo com fallback determinístico de testes."
          fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: |
          python -m mypy \
            src/app.py \
            training/train_model.py \
            src/agent/rag_pipeline.py \
            src/agent/react_agent.py \
            src/security/guardrails.py \
            monitoring/drift_detection.py \
            --explicit-package-bases

      - name: Security scan (bandit)
        run: bandit -r src monitoring -ll

      - name: Test (pytest + coverage gate)
        env:
          TF_ENABLE_ONEDNN_OPTS: "0"
          TF_CPP_MIN_LOG_LEVEL: "2"
          BEDROCK_AWS_REGION: "us-east-1"
        run: pytest --cov=src --cov=monitoring --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=60

  cd:
    name: CD - Build, Push ECR, Deploy ECS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
      ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target environment
        id: target-env
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deployment variables
        run: |
          missing=0
          for var in AWS_REGION ECR_REPOSITORY ECS_CLUSTER_NAME ECS_SERVICE_NAME; do
            if [ -z "${!var}" ]; then
              echo "[ERROR] Missing required GitHub Environment variable: $var"
              missing=1
            fi
          done

          if [ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            echo "[ERROR] Missing required GitHub Environment secret: AWS_ROLE_TO_ASSUME"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Configure variables/secrets in GitHub Environment: ${GITHUB_REF##*/}"
            exit 1
          fi

          echo "Deploy target environment: ${{ steps.target-env.outputs.name }}"
          echo "AWS region: $AWS_REGION"
          echo "ECR repository: $ECR_REPOSITORY"
          echo "ECS cluster: $ECS_CLUSTER_NAME"
          echo "ECS service: $ECS_SERVICE_NAME"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install DVC and pull models from S3
        run: |
          python -m pip install --upgrade pip
          pip install dvc[s3]
          dvc pull --force

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY"
          docker build \
            --build-arg VCS_REF="$GITHUB_SHA" \
            -t "$IMAGE_URI:$IMAGE_TAG" \
            -t "$IMAGE_URI:latest" \
            .
          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"

      - name: Force new ECS deployment (Fargate)
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_SERVICE_NAME" \
            --force-new-deployment

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME"
