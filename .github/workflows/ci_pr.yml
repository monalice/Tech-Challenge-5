name: CI (Pull Requests)

on:
  pull_request:
    branches:
      - main
      - develop
      - release

jobs:
  ci:
    name: CI - Lint, Type Check, Security, Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy bandit pytest pytest-cov

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src monitoring

      - name: Security scan (bandit)
        run: bandit -r src monitoring -ll

      - name: Test (pytest + coverage gate)
        env:
          TF_ENABLE_ONEDNN_OPTS: "0"
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: pytest --cov=src --cov=monitoring --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=60
