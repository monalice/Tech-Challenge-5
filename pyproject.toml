[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "N"]
ignore = ["N803", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = [
  "^\\.venv/",
  "^venv/",
  "^build/",
  "^dist/",
]

[[tool.mypy.overrides]]
module = [
  "mlflow.*",
  "boto3.*",
  "dvc.*",
  "langchain.*",
  "langchain_google_genai.*",
  "ragas.*",
  "presidio_analyzer.*",
  "presidio_anonymizer.*",
  "evidently.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov=monitoring --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=60 -q"
