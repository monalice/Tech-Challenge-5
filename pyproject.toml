[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "N"]
ignore = ["N803", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = [
  "^\\.venv/",
  "^venv/",
  "^build/",
  "^dist/",
]

[[tool.mypy.overrides]]
module = [
  "mlflow.*",
  "boto3.*",
  "joblib",
  "pandas",
  "psutil",
  "requests",
  "sklearn.*",
  "tensorflow.*",
  "langchain.*",
  "langchain_google_genai.*",
  "presidio_analyzer.*",
  "presidio_anonymizer.*",
  "yfinance",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "langchain_openai.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "src.app",
  "src.train_model",
  "src.agent.rag_pipeline",
  "src.agent.react_agent",
  "src.security.guardrails",
  "monitoring.drift_detection",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov=monitoring --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=60 -q"
