[project]
name = "tech-challenge-5"
version = "0.1.0"
dependencies = [
  "mlflow>=2.22,<3",
  "psycopg2-binary>=2.9,<3",
  "SQLAlchemy>=2,<3",
  "boto3>=1.34,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "N"]
ignore = ["N803", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = [
  "^\\.venv/",
  "^venv/",
  "^build/",
  "^dist/",
]

[[tool.mypy.overrides]]
module = [
  "mlflow.*",
  "boto3.*",
  "joblib",
  "pandas",
  "psutil",
  "requests",
  "sklearn.*",
  "tensorflow.*",
  "langchain.*",
  "langchain_google_genai.*",
  "presidio_analyzer.*",
  "presidio_anonymizer.*",
  "evidently.*",
  "yfinance",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "langchain_openai.*",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-config=.coveragerc --cov-report=term-missing -q"
markers = [
  "mlflow_integration: optional integration test that spins up local MLflow container",
]
